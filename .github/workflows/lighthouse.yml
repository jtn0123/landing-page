name: Lighthouse CI

on:
  push:
    branches: [master]
    paths: ['src/**']

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # This workflow audits the deployed production site, so it must NOT pick
      # up the root lighthouserc.json. LHCI auto-discovers that file from the
      # working directory, and it carries
      #   startServerCommand: "npm run build && npm run preview"
      # With no node_modules installed in this job, that failed with
      #   sh: 1: vite: not found      (exit 127)
      # on every run. Passing configPath: '' does not opt out of discovery, so
      # this points at a dedicated prod config instead. The two steps were also
      # collapsed into one: the second re-ran the same collection purely to
      # apply assertions, which the config now carries directly.
      - name: Run Lighthouse against production
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc-prod.json
          uploadArtifacts: true
