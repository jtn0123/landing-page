name: SonarQube

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  sonarqube:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    # GitHub-hosted: the scan uploads to SonarCloud, so nothing here needs
    # local hardware (the old self-hosted runner was just a runner)
    runs-on: ubuntu-latest
    # Informational only — a scan failure never blocks a PR
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:coverage
      # CI runners only have Chromium; Firefox/WebKit are for local testing
      - run: npx playwright test --project=chromium
      - uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          # SonarCloud (the old SONAR_HOST_URL secret pointed at a LAN-only
          # SonarQube server, unreachable from GitHub-hosted runners).
          # SONAR_TOKEN must be a SonarCloud token: sonarcloud.io → My Account
          # → Security → generate, then update the repo secret.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
